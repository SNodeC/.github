name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  control:
    name: Catalog, tests and profile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check catalog
        run: python tools/snodec_sync check
      - name: Unit and workflow boundary tests
        if: ${{ always() && !cancelled() }}
        run: python -m unittest discover -s tests -v
      - name: Check generated profile drift
        if: ${{ always() && !cancelled() }}
        run: |
          python tools/snodec_sync profile --output "$RUNNER_TEMP/profile.md"
          diff -u profile/README.md "$RUNNER_TEMP/profile.md"
