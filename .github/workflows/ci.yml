name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  control:
    name: Catalog, tests and profile drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check catalog
        run: python tools/snodec_sync check
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Unit and workflow boundary tests
        if: ${{ always() && !cancelled() }}
        run: python -m unittest discover -s tests -v
  trigger-member-profile:
    name: Trigger member organization profile sync
    needs: control
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request private profile refresh from public main
        env:
          GH_TOKEN: ${{ secrets.ORG_PROFILE_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api --method POST repos/SNodeC/.github-private/dispatches \
            -f event_type=sync-organization-profile
