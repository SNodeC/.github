name: Validate organization catalog and profile
# Validate the catalog and generated profile. Member-profile refresh is manual.
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  control:
    name: Catalog, tests and profile drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check catalog
        run: python tools/snodec_sync check
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Unit and workflow boundary tests
        if: ${{ always() && !cancelled() }}
        run: python -m unittest discover -s tests -v
