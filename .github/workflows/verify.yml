name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    name: Read build manifest
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.manifest.outputs.profile }}
      config: ${{ steps.manifest.outputs.config }}
      container: ${{ steps.manifest.outputs.container }}
      options: ${{ steps.manifest.outputs.options }}
      artifact_paths: ${{ steps.manifest.outputs.artifact_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Read and validate manifest
        id: manifest
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import yaml

          manifest = yaml.safe_load(Path(".snodec/repo.yml").read_text())
          if not isinstance(manifest, dict) or not isinstance(manifest.get("ci"), dict):
              raise ValueError("manifest must contain a ci mapping")
          cpp = {
              "profile": "cpp", "container": "gcc:15.3.0-trixie", "apt": [], "deps": [],
              "cmake_options": [], "ctest": True, "ctest_args": ["--output-on-failure"],
              "ipv6": False, "runtime_dirs": False, "parallel": 2, "env": {}, "ctest_launcher": [], "timeout_minutes": 60,
          }
          python = {
              "profile": "python", "python_version": "3.12", "pip": ".[dev]",
              "native_build": [], "smoke": {}, "artifact_globs": [],
          }
          profile = manifest["ci"].get("profile", "cpp")
          if profile not in ("cpp", "python"):
              raise ValueError("only cpp and python profiles are supported")
          defaults = cpp if profile == "cpp" else python
          if manifest["ci"].keys() - defaults.keys():
              raise ValueError("unsupported ci fields")
          config = defaults | manifest["ci"]
          if profile == "python":
              if not isinstance(config["python_version"], str) or not re.fullmatch(r"3[.][0-9]+", config["python_version"]):
                  raise ValueError("python_version must specify Python 3")
              if not isinstance(config["pip"], str) or not config["pip"].startswith("."):
                  raise ValueError("pip must specify the local project")
              if not isinstance(config["smoke"], dict) or set(config["smoke"]) != {"Linux", "Windows", "macOS"}:
                  raise ValueError("smoke must contain commands for all three native platforms")
              for key, values in {"native_build": config["native_build"], "artifact_globs": config["artifact_globs"], **config["smoke"]}.items():
                  if not isinstance(values, list) or not values or any(not isinstance(v, str) or not v or any(c in v for c in "\r\n\0") for v in values):
                      raise ValueError(key + " must be a non-empty argument list")
              config["container"] = cpp["container"]
          if not isinstance(config["container"], str) or not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._/:@-]*", config["container"]
          ):
              raise ValueError("container must be an image reference")
          for key in ("ctest", "ipv6", "runtime_dirs") if profile == "cpp" else ():
              if type(config[key]) is not bool:
                  raise ValueError(key + " must be a boolean")
          if profile == "cpp" and (not isinstance(config["env"], dict) or any(
              not isinstance(key, str) or not re.fullmatch(r"[A-Z][A-Z0-9_]*", key) or key.startswith(("GITHUB_", "RUNNER_", "GH_"))
              or not isinstance(value, str) or any(c in value for c in "\r\n\0")
              for key, value in config["env"].items()
          )):
              raise ValueError("env must contain non-reserved single-line environment values")
          if profile == "cpp" and (type(config["parallel"]) is not int or not 1 <= config["parallel"] <= 32):
              raise ValueError("parallel must be between 1 and 32")
          if profile == "cpp" and (type(config["timeout_minutes"]) is not int or not 10 <= config["timeout_minutes"] <= 180):
              raise ValueError("timeout_minutes must be an integer between 10 and 180")
          for key in ("apt", "deps", "cmake_options", "ctest_args", "ctest_launcher") if profile == "cpp" else ():
              if not isinstance(config[key], list) or any(
                  not isinstance(item, str) or not item or any(c in item for c in "\r\n\0")
                  for item in config[key]
              ):
                  raise ValueError(key + " must be a list of single-line arguments")
          if profile == "cpp" and any(not re.fullmatch(r"[a-z0-9][a-z0-9+.-]*(?::[a-z0-9]+)?", p) for p in config["apt"]):
              raise ValueError("apt must contain package names, not options")
          if profile == "cpp" and any(not re.fullmatch(r"[A-Za-z0-9_.-]+@source", d) for d in config["deps"]):
              raise ValueError("deps supports SNodeC repository names with @source")
          if profile == "cpp" and len(config["deps"]) != len({d.split("@")[0] for d in config["deps"]}):
              raise ValueError("deps must be unique and ordered")
          options = "--cap-add=NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0" if config.get("ipv6") else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("profile=" + profile + "\n")
              output.write("config=" + json.dumps(config, separators=(",", ":")) + "\n")
              output.write("container=" + config["container"] + "\n")
              output.write("options=" + options + "\n")
              if profile == "python":
                  output.write("artifact_paths<<artifact_paths_end\n" + "\n".join(config["artifact_globs"]) + "\nartifact_paths_end\n")

  cpp:
    name: snodec / cpp
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.config).timeout_minutes }}
    needs: prepare
    if: ${{ needs.prepare.outputs.profile == 'cpp' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.container }}
      options: ${{ needs.prepare.outputs.options }}
    defaults:
      run:
        shell: bash
    env:
      CI_CONFIG: ${{ needs.prepare.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install base build packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build pkg-config git ca-certificates \
            libssl-dev libmagic-dev libbluetooth-dev nlohmann-json3-dev iproute2 python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install extra packages and prepare runtime
        shell: python3 {0}
        run: |
          import grp
          import json
          import os
          import subprocess

          config = json.loads(os.environ["CI_CONFIG"])
          try:
              grp.getgrnam("snodec")
          except KeyError:
              subprocess.run(["groupadd", "--system", "snodec"], check=True)
          subprocess.run(["useradd", "--create-home", "--gid", "snodec", "snodec"], check=True)
          if config["apt"]:
              subprocess.run(["apt-get", "install", "-y", "--no-install-recommends", *config["apt"]], check=True)
          if config["runtime_dirs"]:
              subprocess.run(["install", "-d", "-m", "0770", "-g", "snodec",
                              "/etc/snode.c", "/var/log/snode.c", "/var/run/snode.c"], check=True)
          if config["ipv6"]:
              subprocess.run(["ip", "link", "add", "snodec-ci-v6", "type", "dummy"], check=True)
              subprocess.run(["ip", "link", "set", "snodec-ci-v6", "up"], check=True)
              subprocess.run(["ip", "-6", "address", "add", "fd00::1/128", "dev", "snodec-ci-v6"], check=True)
              subprocess.run(["ip", "-6", "address", "show", "dev", "snodec-ci-v6"], check=True)
      - name: Record toolchain versions
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          pkg-config --version
          git --version
      - name: Build ordered source dependencies, test and stage caller
        shell: python3 {0}
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          config = json.loads(os.environ["CI_CONFIG"])
          token = os.environ.pop("GH_READ_TOKEN", "")
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temporary = Path(os.environ["RUNNER_TEMP"]) / "snodec"
          temporary.mkdir(parents=True, exist_ok=True)
          prefixes = []
          build_env = os.environ.copy()
          build_env.update(config["env"])

          def run(*args):
              args = [str(arg) for arg in args]
              print("+ " + shlex.join(args), flush=True)
              subprocess.run(args, check=True, env=build_env)

          def api(path):
              headers = {"Accept": "application/vnd.github+json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              with urlopen(Request("https://api.github.com/" + path, headers=headers), timeout=60) as response:
                  return json.load(response)

          def build(source, name, options, test=False):
              directory = temporary / "build" / name
              prefix = temporary / "stage" / name
              run("cmake", "-S", source, "-B", directory, "-G", "Ninja",
                  *options, "-DCMAKE_INSTALL_PREFIX=" + str(prefix),
                  "-DCMAKE_PREFIX_PATH=" + ";".join(reversed(prefixes)),
                  "-DCMAKE_INSTALL_LIBDIR=lib")
              run("cmake", "--build", directory, "--parallel", config["parallel"])
              if test:
                  run("chown", "-R", "snodec:snodec", directory)
                  run("runuser", "-u", "snodec", "--", "env",
                      "LD_LIBRARY_PATH=" + build_env.get("LD_LIBRARY_PATH", ""),
                      *config["ctest_launcher"], "ctest", "--test-dir", directory, *config["ctest_args"], "--no-tests=error")
              run("cmake", "--install", directory)
              stage(prefix)

          def stage(prefix):
              prefixes.append(str(prefix))
              build_env["CMAKE_PREFIX_PATH"] = os.pathsep.join(reversed(prefixes))
              libraries = [str(Path(p) / lib) for p in reversed(prefixes) for lib in ("lib", "lib64", "lib/snode.c/web/http", "lib64/snode.c/web/http")]
              build_env["LD_LIBRARY_PATH"] = os.pathsep.join(libraries)

          for dependency in config["deps"]:
              name = dependency.removesuffix("@source")
              repository = "repos/SNodeC/" + quote(name, safe="")
              branch = api(repository)["default_branch"]
              sha = api(repository + "/commits/" + quote(branch, safe=""))["sha"]
              print(f"Dependency {name}: default branch {branch!r}, commit {sha}", flush=True)
              source = temporary / "source" / name
              run("git", "init", source)
              run("git", "-C", source, "remote", "add", "origin", f"https://github.com/SNodeC/{name}.git")
              run("git", "-C", source, "fetch", "--depth", "1", "origin", sha)
              run("git", "-C", source, "checkout", "--detach", "FETCH_HEAD")
              run("git", "-C", source, "submodule", "update", "--init", "--recursive")
              build(source, name, ["-DCMAKE_BUILD_TYPE=Debug", "-DBUILD_TESTING=OFF"])
          build(workspace, "caller", config["cmake_options"], test=config["ctest"])

  hygiene:
    name: snodec / hygiene
    timeout-minutes: 15
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 clang-format cmake-format
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check whitespace against PR base or previous commit
        if: ${{ always() && !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD -- . ":(exclude)*.md" ":(exclude)*.svg" ":(exclude)navigation/**" ":(exclude)brand/**" ":(exclude)docs/**" ":(exclude)profile/**" ":(exclude)site/**"
      - name: Check changed source formatting
        if: ${{ always() && !cancelled() }}
        shell: python3 {0}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          base = os.environ.get("PR_BASE") or subprocess.run(
              ["git", "rev-parse", "HEAD^"], capture_output=True, text=True).stdout.strip()
          if not base:
              base = subprocess.check_output(["git", "hash-object", "-t", "tree", "/dev/null"], text=True).strip()
          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", "-z", base, "HEAD"]
          ).decode().split("\0")
          failures = []
          for filename in filter(None, files):
              path = Path(filename)
              if not path.is_file():
                  continue
              if path.suffix in (".cpp", ".h", ".hpp", ".cc", ".c") and Path(".clang-format").exists():
                  if subprocess.run(["clang-format", "--dry-run", "--Werror", filename]).returncode:
                      failures.append(filename + ": clang-format")
              if (path.name == "CMakeLists.txt" or path.suffix == ".cmake") and Path(".cmake-format.py").exists():
                  if subprocess.run(["cmake-format", "--check", filename]).returncode:
                      failures.append(filename + ": cmake-format")
          if failures:
              raise SystemExit("\n".join(failures))


  python:
    name: snodec / python (${{ matrix.os }})
    timeout-minutes: 60
    needs: prepare
    if: ${{ needs.prepare.outputs.profile == 'python' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CI_CONFIG: ${{ needs.prepare.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.prepare.outputs.config).python_version }}
      - name: Install development dependencies
        shell: python
        run: |
          import json
          import os
          import subprocess
          subprocess.run(["python", "-m", "pip", "install", "-e", json.loads(os.environ["CI_CONFIG"])["pip"]], check=True)
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0
      - name: Tests independent of physical audio devices
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not audio_device"
      - name: Build native package
        id: package
        if: ${{ always() && !cancelled() }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          subprocess.run(json.loads(os.environ["CI_CONFIG"])["native_build"], check=True)
      - name: Native packaged launch
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import json
          import os
          import subprocess
          subprocess.run(json.loads(os.environ["CI_CONFIG"])["smoke"][os.environ["RUNNER_OS"]], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: ${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ needs.prepare.outputs.artifact_paths }}
          if-no-files-found: error
