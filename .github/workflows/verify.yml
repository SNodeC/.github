name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    name: Read C++ manifest
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.manifest.outputs.config }}
      container: ${{ steps.manifest.outputs.container }}
      options: ${{ steps.manifest.outputs.options }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Read and validate manifest
        id: manifest
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import yaml

          manifest = yaml.safe_load(Path(".snodec/repo.yml").read_text())
          if not isinstance(manifest, dict) or not isinstance(manifest.get("ci"), dict):
              raise ValueError("manifest must contain a ci mapping")
          defaults = {
              "profile": "cpp", "container": "gcc:15.3.0-trixie", "apt": [], "deps": [],
              "cmake_options": [], "ctest": True, "ctest_args": ["--output-on-failure"],
              "ipv6": False, "runtime_dirs": False,
          }
          if manifest["ci"].keys() - defaults.keys():
              raise ValueError("unsupported ci fields")
          config = defaults | manifest["ci"]
          if config["profile"] != "cpp":
              raise ValueError("only the cpp profile is supported")
          if not isinstance(config["container"], str) or not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._/:@-]*", config["container"]
          ):
              raise ValueError("container must be an image reference")
          for key in ("ctest", "ipv6", "runtime_dirs"):
              if type(config[key]) is not bool:
                  raise ValueError(key + " must be a boolean")
          for key in ("apt", "deps", "cmake_options", "ctest_args"):
              if not isinstance(config[key], list) or any(
                  not isinstance(item, str) or not item or any(c in item for c in "\r\n\0")
                  for item in config[key]
              ):
                  raise ValueError(key + " must be a list of single-line arguments")
          if any(not re.fullmatch(r"[a-z0-9][a-z0-9+.-]*(?::[a-z0-9]+)?", p) for p in config["apt"]):
              raise ValueError("apt must contain package names, not options")
          if any(not re.fullmatch(r"[A-Za-z0-9_.-]+@source", d) for d in config["deps"]):
              raise ValueError("deps supports only SNodeC repository names with @source")
          if len(config["deps"]) != len(set(config["deps"])):
              raise ValueError("deps must be unique and ordered")
          options = "--cap-add=NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0" if config["ipv6"] else ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("config=" + json.dumps(config, separators=(",", ":")) + "\n")
              output.write("container=" + config["container"] + "\n")
              output.write("options=" + options + "\n")

  cpp:
    name: snodec / cpp
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.container }}
      options: ${{ needs.prepare.outputs.options }}
    defaults:
      run:
        shell: bash
    env:
      CI_CONFIG: ${{ needs.prepare.outputs.config }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install base build packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build pkg-config git ca-certificates \
            libssl-dev libmagic-dev libbluetooth-dev nlohmann-json3-dev iproute2 python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install extra packages and prepare runtime
        shell: python3 {0}
        run: |
          import grp
          import json
          import os
          import subprocess

          config = json.loads(os.environ["CI_CONFIG"])
          if config["apt"]:
              subprocess.run(["apt-get", "install", "-y", "--no-install-recommends", *config["apt"]], check=True)
          if config["runtime_dirs"]:
              try:
                  grp.getgrnam("snodec")
              except KeyError:
                  subprocess.run(["groupadd", "--system", "snodec"], check=True)
              subprocess.run(["install", "-d", "-m", "0770", "-g", "snodec",
                              "/etc/snode.c", "/var/log/snode.c", "/var/run/snode.c"], check=True)
          if config["ipv6"]:
              subprocess.run(["ip", "link", "add", "snodec-ci-v6", "type", "dummy"], check=True)
              subprocess.run(["ip", "link", "set", "snodec-ci-v6", "up"], check=True)
              subprocess.run(["ip", "-6", "address", "add", "fd00::1/128", "dev", "snodec-ci-v6"], check=True)
              subprocess.run(["ip", "-6", "address", "show", "dev", "snodec-ci-v6"], check=True)
      - name: Record toolchain versions
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          pkg-config --version
          git --version
      - name: Build ordered source dependencies, test and stage caller
        shell: python3 {0}
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          config = json.loads(os.environ["CI_CONFIG"])
          token = os.environ.pop("GH_READ_TOKEN", "")
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temporary = Path(os.environ["RUNNER_TEMP"]) / "snodec"
          temporary.mkdir(parents=True, exist_ok=True)
          prefixes = []
          build_env = os.environ.copy()

          def run(*args):
              args = [str(arg) for arg in args]
              print("+ " + shlex.join(args), flush=True)
              subprocess.run(args, check=True, env=build_env)

          def api(path):
              headers = {"Accept": "application/vnd.github+json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              with urlopen(Request("https://api.github.com/" + path, headers=headers), timeout=60) as response:
                  return json.load(response)

          def build(source, name, options, test=False):
              directory = temporary / "build" / name
              prefix = temporary / "stage" / name
              run("cmake", "-S", source, "-B", directory, "-G", "Ninja",
                  *options, "-DCMAKE_INSTALL_PREFIX=" + str(prefix),
                  "-DCMAKE_PREFIX_PATH=" + ";".join(reversed(prefixes)),
                  "-DCMAKE_INSTALL_LIBDIR=lib")
              run("cmake", "--build", directory, "--parallel", os.cpu_count() or 2)
              if test:
                  run("ctest", "--test-dir", directory, *config["ctest_args"])
              run("cmake", "--install", directory)
              prefixes.append(str(prefix))
              build_env["CMAKE_PREFIX_PATH"] = os.pathsep.join(reversed(prefixes))
              libraries = [str(Path(p) / lib) for p in reversed(prefixes) for lib in ("lib", "lib64")]
              build_env["LD_LIBRARY_PATH"] = os.pathsep.join(libraries)

          for dependency in config["deps"]:
              name = dependency.removesuffix("@source")
              repository = "repos/SNodeC/" + quote(name, safe="")
              branch = api(repository)["default_branch"]
              sha = api(repository + "/commits/" + quote(branch, safe=""))["sha"]
              print(f"Dependency {name}: default branch {branch!r}, commit {sha}", flush=True)
              source = temporary / "source" / name
              run("git", "init", source)
              run("git", "-C", source, "remote", "add", "origin", f"https://github.com/SNodeC/{name}.git")
              run("git", "-C", source, "fetch", "--depth", "1", "origin", sha)
              run("git", "-C", source, "checkout", "--detach", "FETCH_HEAD")
              run("git", "-C", source, "submodule", "update", "--init", "--recursive")
              build(source, name, ["-DCMAKE_BUILD_TYPE=Release", "-DBUILD_TESTING=OFF"])
          build(workspace, "caller", config["cmake_options"], test=config["ctest"])
      - name: Check whitespace against PR base or previous commit
        if: ${{ always() && !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD
