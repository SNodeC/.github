<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="h-title h-desc"><title id="h-title">SNode.C</title><desc id="h-desc">SNode.C organization — SNode.C, an event-driven C++ networking framework, at the centre of an animated constellation: MQTTSuite, AISuite, CodexUI, Packages, the Book Companion, and community projects.</desc><style>
.flow{stroke-dasharray:3 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.orbit{transform-origin:1012px 160px;animation:spin 90s linear infinite}
.orbit-rev{transform-origin:1012px 160px;animation:spin 140s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-out infinite;opacity:0}
.pulse2{animation-delay:1.8s}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@keyframes hp0{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0.0px,-45.2px);opacity:0}}.hp0{animation:hp0 2.8s cubic-bezier(.45,0,.55,1) 0.00s infinite}
@keyframes hp1{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(39.1px,-22.6px);opacity:0}}.hp1{animation:hp1 2.8s cubic-bezier(.45,0,.55,1) 0.47s infinite}
@keyframes hp2{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(39.1px,22.6px);opacity:0}}.hp2{animation:hp2 2.8s cubic-bezier(.45,0,.55,1) 0.94s infinite}
@keyframes hp3{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0.0px,45.2px);opacity:0}}.hp3{animation:hp3 2.8s cubic-bezier(.45,0,.55,1) 1.41s infinite}
@keyframes hp4{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-39.1px,22.6px);opacity:0}}.hp4{animation:hp4 2.8s cubic-bezier(.45,0,.55,1) 1.88s infinite}
@keyframes hp5{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-39.1px,-22.6px);opacity:0}}.hp5{animation:hp5 2.8s cubic-bezier(.45,0,.55,1) 2.35s infinite}
@media (prefers-reduced-motion: reduce){.flow,.orbit,.orbit-rev,.pulse,.pk,.twinkle{animation:none!important}.pk,.pulse{opacity:0}}
