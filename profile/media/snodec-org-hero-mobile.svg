<svg xmlns="http://www.w3.org/2000/svg" width="640" height="372" viewBox="0 0 640 372" role="img" aria-labelledby="m-title m-desc"><title id="m-title">SNodeC</title><desc id="m-desc">SNodeC organization — SNode.C, an event-driven C++ networking framework, at the centre of an animated constellation: MQTTSuite, AISuite, CodexUI, Packages, the Book Companion, and tools and services.</desc><style>
.flow{stroke-dasharray:3 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.orbit{transform-origin:534px 104px;animation:spin 90s linear infinite}
.orbit-rev{transform-origin:534px 104px;animation:spin 140s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-out infinite;opacity:0}
.pulse2{animation-delay:1.8s}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
@keyframes mp0{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0.0px,-45.2px);opacity:0}}.mp0{animation:mp0 2.8s cubic-bezier(.45,0,.55,1) 0.00s infinite}
@keyframes mp1{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(39.1px,-22.6px);opacity:0}}.mp1{animation:mp1 2.8s cubic-bezier(.45,0,.55,1) 0.47s infinite}
@keyframes mp2{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(39.1px,22.6px);opacity:0}}.mp2{animation:mp2 2.8s cubic-bezier(.45,0,.55,1) 0.94s infinite}
@keyframes mp3{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0.0px,45.2px);opacity:0}}.mp3{animation:mp3 2.8s cubic-bezier(.45,0,.55,1) 1.41s infinite}
@keyframes mp4{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-39.1px,22.6px);opacity:0}}.mp4{animation:mp4 2.8s cubic-bezier(.45,0,.55,1) 1.88s infinite}
@keyframes mp5{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-39.1px,-22.6px);opacity:0}}.mp5{animation:mp5 2.8s cubic-bezier(.45,0,.55,1) 2.35s infinite}
@media (prefers-reduced-motion: reduce){.flow,.orbit,.orbit-rev,.pulse,.pk,.twinkle{animation:none!important}.pk,.pulse{opacity:0}}
